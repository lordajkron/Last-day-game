<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LAST DAY - 2.5D Dark Fantasy Adventure</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#120e18">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #eaeaea;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070509;
    }
    canvas#viewport {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .bar-container {
      width: 180px;
      background: rgba(10, 8, 15, 0.85);
      border: 2px solid #3a2e4c;
      border-radius: 4px;
      padding: 4px;
      margin-bottom: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }
    .bar-label {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 1px;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #1a1525;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    .hp-fill { background: linear-gradient(90deg, #800000, #e94560); }
    .stamina-fill { background: linear-gradient(90deg, #106020, #2ecc71); }
    .mana-fill { background: linear-gradient(90deg, #103080, #3498db); }
    .stats-card {
      background: rgba(10, 8, 15, 0.85);
      border: 2px solid #3a2e4c;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      color: #e2d8ee;
      text-align: right;
    }
    .boss-hud {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      max-width: 400px;
      background: rgba(15, 5, 10, 0.9);
      border: 2px solid #a8233c;
      padding: 6px;
      border-radius: 4px;
      display: none;
      text-align: center;
    }
    .boss-name {
      font-size: 11px;
      color: #ff4d6d;
      letter-spacing: 2px;
      margin-bottom: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
    /* Touch Virtual Controls */
    .touch-controls {
      position: absolute;
      bottom: 12px;
      left: 12px; right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
    }
    .joystick-zone {
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    .joystick-knob {
      width: 44px;
      height: 44px;
      background: rgba(233, 69, 96, 0.5);
      border: 2px solid #e94560;
      border-radius: 50%;
      position: absolute;
      top: 33px; left: 33px;
      pointer-events: none;
    }
    .action-buttons {
      display: grid;
      grid-template-columns: repeat(2, 54px);
      gap: 10px;
    }
    .btn-action {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(26, 21, 37, 0.85);
      border: 2px solid #5a4278;
      color: #fff;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      active-scale: 0.95;
    }
    .btn-attack { border-color: #e94560; background: rgba(128, 0, 0, 0.4); }
    .btn-magic { border-color: #3498db; background: rgba(16, 48, 128, 0.4); }
    .btn-roll { border-color: #2ecc71; background: rgba(16, 96, 32, 0.4); }
    
    .overlay-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 3, 8, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }
    .overlay-title {
      font-size: 32px;
      letter-spacing: 4px;
      color: #e94560;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
      text-align: center;
    }
    .overlay-subtitle {
      font-size: 12px;
      color: #8a7a9e;
      margin-bottom: 24px;
      text-align: center;
      max-width: 80%;
    }
    .btn-start {
      padding: 12px 28px;
      background: #e94560;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="viewport" width="128" height="128"></canvas>

    <div class="ui-layer">
      <div class="hud-top">
        <div>
          <div class="bar-container">
            <div class="bar-label"><span>VITALITY</span><span id="hp-txt">100/100</span></div>
            <div class="bar-bg"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
          </div>
          <div class="bar-container">
            <div class="bar-label"><span>STAMINA</span><span id="st-txt">100/100</span></div>
            <div class="bar-bg"><div id="st-bar" class="bar-fill stamina-fill"></div></div>
          </div>
          <div class="bar-container">
            <div class="bar-label"><span>ESSENCE</span><span id="mp-txt">50/50</span></div>
            <div class="bar-bg"><div id="mp-bar" class="bar-fill mana-fill"></div></div>
          </div>
        </div>
        <div class="stats-card">
          <div>SOULS: <span id="souls-count" style="color:#f1c40f">0</span></div>
          <div>FLOOR: <span id="floor-count" style="color:#e94560">1</span></div>
        </div>
      </div>

      <div class="boss-hud" id="boss-hud">
        <div class="boss-name" id="boss-name">THE FALLEN ARCHON</div>
        <div class="bar-bg"><div id="boss-hp-bar" class="bar-fill hp-fill"></div></div>
      </div>

      <div class="touch-controls">
        <div class="joystick-zone" id="joystick">
          <div class="joystick-knob" id="knob"></div>
        </div>
        <div class="action-buttons">
          <button class="btn-action btn-attack" id="btn-attack">⚔️</button>
          <button class="btn-action btn-magic" id="btn-magic">✨</button>
          <button class="btn-action btn-roll" id="btn-roll">💨</button>
        </div>
      </div>
    </div>

    <div class="overlay-screen" id="start-overlay">
      <div class="overlay-title">LAST DAY</div>
      <div class="overlay-subtitle">2.5D DARK FANTASY RETRO ADVENTURE</div>
      <button class="btn-start" id="btn-start">ENTER THE DUNGEON</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
